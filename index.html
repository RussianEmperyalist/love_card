<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#f6dfd3">

    <title>Для тебя ❤️</title>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap"
        rel="stylesheet"
    >

    <!-- Основные стили -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- =========================================
             ЭКРАН 1
        ========================================== -->

        <section class="screen screen-1 active" id="screen1">

            <div class="floating-hearts" aria-hidden="true"></div>

            <div class="intro-content">

                <span class="small-label">
                    маленький вопрос
                </span>

                <h1>
                    Как ты хочешь<br>
                    провести нашу<br>
                    прогулку?
                </h1>

                <p class="intro-description">
                    Выбирай, а остальное я беру на себя
                </p>

                <div class="choices">

                    <button
                        class="choice choice-city"
                        type="button"
                        data-choice="city"
                    >
                        <span class="choice-icon">♡</span>

                        <span class="choice-text">
                            <strong>Прогулка<br>по городу</strong>
                            <small>
                                гулять, разговаривать<br>
                                и никуда не спешить
                            </small>
                        </span>

                        <span class="choice-arrow">→</span>
                    </button>


                    <button
                        class="choice choice-cinema"
                        type="button"
                        data-choice="cinema"
                    >
                        <span class="choice-icon">◌</span>

                        <span class="choice-text">
                            <strong>Вечер<br>в кино</strong>
                            <small>
                                фильм, уют<br>
                                и время только для нас
                            </small>
                        </span>

                        <span class="choice-arrow">→</span>
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================================
             ЭКРАН 2 — ПИСЬМО
        ========================================== -->

        <section class="screen screen-2" id="screen2">

            <div class="letter-wrapper">

                <div class="letter-decoration">
                    ✦
                </div>

                <p class="letter-label">
                    для тебя
                </p>

                <div class="letter">

                    <p class="letter-greeting">
                        Моя хорошая,
                    </p>

                    <div
                        class="letter-text"
                        id="letterText"
                    ></div>

                    <p class="letter-signature">
                        Твой ❤️
                    </p>

                </div>

                <button
                    class="continue-button"
                    id="continueButton"
                    type="button"
                >
                    <span>Дальше</span>
                    <span>→</span>
                </button>

            </div>

        </section>


        <!-- =========================================
             ЭКРАН 3 — ФОТО-СЕРДЦЕ
        ========================================== -->

        <section class="screen screen-3" id="screen3">

            <div class="final-content">

                <p class="final-label">
                    и самое главное...
                </p>


                <!-- ФОТО-СЕРДЦЕ -->

                <div class="photo-heart" id="photoHeart">

                    <div class="heart-photo photo-1">
                        <img
                            src="./img/1.jpg"
                            alt="Наше фото 1"
                        >
                    </div>

                    <div class="heart-photo photo-2">
                        <img
                            src="./img/2.jpg"
                            alt="Наше фото 2"
                        >
                    </div>

                    <div class="heart-photo photo-3">
                        <img
                            src="./img/3.jpg"
                            alt="Наше фото 3"
                        >
                    </div>

                    <div class="heart-photo photo-4">
                        <img
                            src="./img/4.jpg"
                            alt="Наше фото 4"
                        >
                    </div>

                    <div class="heart-photo photo-5">
                        <img
                            src="./img/5.jpg"
                            alt="Наше фото 5"
                        >
                    </div>

                    <div class="heart-photo photo-6">
                        <img
                            src="./img/6.jpg"
                            alt="Наше фото 6"
                        >
                    </div>

                    <div class="heart-photo photo-7">
                        <img
                            src="./img/7.jpg"
                            alt="Наше фото 7"
                        >
                    </div>

                    <div class="heart-photo photo-8">
                        <img
                            src="./img/8.jpg"
                            alt="Наше фото 8"
                        >
                    </div>


                    <!-- Слово LOVE поверх фотографий -->

                    <div class="love-word">
                        love
                    </div>

                </div>


                <!-- Финальный текст -->

                <div class="final-message">

                    <h2>
                        Где бы мы ни были —
                        <span>мне хорошо с тобой.</span>
                    </h2>

                    <p id="finalChoiceText">
                        Главное, что мы будем вместе.
                    </p>

                </div>


                <!-- Кнопка музыки -->

                <button
                    class="music-button"
                    id="musicButton"
                    type="button"
                    aria-label="Управление музыкой"
                >
                    <span class="music-icon">♫</span>

                    <span id="musicText">
                        музыка
                    </span>
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         ФОНОВАЯ МУЗЫКА
    ========================================== -->

    <audio
        id="music"
        loop
        preload="metadata"
    >
        <source
            src="music.mp3"
            type="audio/mpeg"
        >

        Ваш браузер не поддерживает аудио.
    </audio>


    <!-- JavaScript -->
    <script src="index.js"></script>

</body>
</html>
